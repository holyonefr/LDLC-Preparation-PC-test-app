name: AMD - Chocolatey catalog and official package verification on Windows
on:
  workflow_dispatch:
    inputs:
      inspect_guru3d:
        description: 'Sonde facultative Guru3D (actuellement HTTP 403 sur runner)'
        type: boolean
        default: false
      full_package:
        description: 'Verifier aussi le package complet officiel et ses metadonnees'
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  download:
    if: github.repository == 'holyonefr/LDLC-Preparation-PC-test-app'
    runs-on: windows-2025
    timeout-minutes: 25
    env:
      LDLC_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Native AMD regression diagnostics without installing hardware
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $powershell=Join-Path $env:WINDIR 'System32/WindowsPowerShell/v1.0/powershell.exe'
          $testRoot=Join-Path $env:RUNNER_TEMP 'amd-native-child-fixture'
          [void](New-Item -ItemType Directory -Path $testRoot -Force)
          $env:ProgramData=$testRoot;$env:LOCALAPPDATA=$testRoot
          $ErrorActionPreference='Continue'
          $result=@(& $powershell -STA -NoProfile -ExecutionPolicy Bypass -File ./tools/Test-LDLCAmdUpdateRegression.ps1 2>&1)
          $code=$LASTEXITCODE
          $ErrorActionPreference='Stop'
          $result|ForEach-Object {Write-Host $_}
          if($code -ne 0){
            $message=($result|Out-String).Replace('%','%25').Replace("`r",'%0D').Replace("`n",'%0A')
            Write-Host ('::error title=Native AMD child failure::'+$message)
            throw "AMD child failed: $code"
          }
      - name: Inspect Chocolatey published package without executing its installation script
        if: always()
        shell: powershell
        run: ./tools/Test-LDLCAmdChocolateyPackage.ps1
      - name: Inspect the requested Guru3D source without running any installer
        if: always() && inputs.inspect_guru3d
        shell: powershell
        run: ./tools/Test-LDLCAmdGuru3dSource.ps1
      - name: Verify current official complete package without running its installer
        if: always() && inputs.full_package
        shell: powershell
        run: ./tools/Test-LDLCAmdOfficialDownload.ps1 -FullPackage
