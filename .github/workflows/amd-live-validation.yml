name: AMD - official download on Windows without hardware installation
on:
  workflow_dispatch:
    inputs:
      full_package:
        description: 'Verifier aussi le package complet officiel et ses metadonnees'
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  download:
    if: github.repository == 'holyonefr/LDLC-Preparation-PC-test-app'
    runs-on: windows-2025
    timeout-minutes: 15
    env:
      LDLC_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Resolve and verify the actual AMD official installer without running it
        shell: powershell
        run: ./tools/Test-LDLCAmdOfficialDownload.ps1 -FullPackage:('${{ inputs.full_package }}' -eq 'true')
