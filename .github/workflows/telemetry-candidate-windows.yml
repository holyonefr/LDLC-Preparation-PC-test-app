name: Transmission candidate - three Windows editions without production publication
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  candidate:
    runs-on: windows-2025
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - repository: LDLC-Preparation
            revision: 0b7c369853c47c1e495f1c0efb3a64d29346dc98
          - repository: Numerik-s-Preparation-PC
            revision: f230c544ee51c10cfba85ff7b810c723900259fe
          - repository: LDLC-Preparation-Addon
            revision: 142629f8424769f6d2cc0ed1b7a1752662838f79
    env:
      LDLC_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: harness
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: holyonefr/${{ matrix.repository }}
          ref: ${{ matrix.revision }}
          path: application
          lfs: true
          persist-credentials: false
      - name: Apply only the unpublished transmission candidate
        working-directory: application
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $patch='../harness/beta/patches/transmission/${{ matrix.repository }}.patch'
          git apply --check -- $patch
          if($LASTEXITCODE -ne 0){throw 'Candidate patch does not match the pinned production revision'}
          git apply -- $patch
          if($LASTEXITCODE -ne 0){throw 'Candidate application failed'}
          Write-Host ('::notice title=Transmission candidate source::'+(@{Repository='holyonefr/${{ matrix.repository }}';BaseCommit='${{ matrix.revision }}';PatchSHA256=(Get-FileHash $patch).Hash;ProductionPublished=$false}|ConvertTo-Json -Compress))
      - name: Build the candidate with the edition branding
        working-directory: application
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          if('${{ matrix.repository }}' -eq 'LDLC-Preparation-Addon'){
            ./tools/Rebuild-LDLCPreparationPC.ps1 -Source main
            ./tools/Rebuild-LDLCPreparationPC.ps1 -Source worker
            ./tools/Update-AddonEmbeddedScripts.ps1
          }else{./tools/Build-LDLCPreparationPCExe.ps1}
      - name: Run the full release suite including offline delivery recovery
        working-directory: application
        shell: powershell
        run: |
          $ErrorActionPreference='Continue'
          $shell=Join-Path $env:WINDIR 'System32/WindowsPowerShell/v1.0/powershell.exe'
          $test=if('${{ matrix.repository }}' -eq 'LDLC-Preparation-Addon'){'Test-AddonSync.ps1'}else{'Test-LDLCRelease.ps1'}
          $output=@(& $shell -STA -NoProfile -ExecutionPolicy Bypass -File "tools/$test" 2>&1)
          $code=$LASTEXITCODE
          $output | ForEach-Object {Write-Host $_}
          if($code -ne 0){
            $detail=($output | Select-Object -Last 16 | ForEach-Object {[string]$_}) -join "`n"
            $detail=$detail -replace 'https?://\S+','[address]' -replace 'LDLC-(Dashboard|PrepTool)-[A-Za-z0-9-]+','[key]'
            $detail=$detail.Replace('%','%25').Replace("`r",'%0D').Replace("`n",'%0A')
            Write-Host "::error title=Transmission candidate regressions::$detail"
            throw ('Native candidate regression failure: '+$code)
          }
      - name: Send real success error and stop reports and verify the dashboard
        working-directory: application
        shell: powershell
        run: ./tools/Test-PreparationDashboardRoundTrip.ps1 -ReportPath artifacts/dashboard-roundtrip.json
      - name: Open and close the real candidate executable four times
        working-directory: application
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $shell=Join-Path $env:WINDIR 'System32/WindowsPowerShell/v1.0/powershell.exe'
          for($i=1;$i -le 4;$i++){
            & $shell -STA -NoProfile -ExecutionPolicy Bypass -File tools/Test-PreparationUiLaunch.ps1 -Artifacts "artifacts/preview-$i"
            if($LASTEXITCODE -ne 0){throw "Candidate preview $i failed"}
          }
          $executables=@(Get-ChildItem dist -Filter '*.exe' -File)
          if($executables.Count -ne 1){throw 'Unexpected candidate executable count'}
          Write-Host ('::notice title=Transmission candidate Windows::'+(@{Repository='holyonefr/${{ matrix.repository }}';BaseCommit='${{ matrix.revision }}';PatchSHA256=(Get-FileHash '../harness/beta/patches/transmission/${{ matrix.repository }}.patch').Hash;ExecutableSHA256=$executables[0]|Get-FileHash|Select-Object -ExpandProperty Hash;ReleaseSuitePassed=$true;PreviewCount=4;RealDashboardRoundTrip=$true;ProductionPublished=$false;RealAntivirusRemoved=$false}|ConvertTo-Json -Compress))
      - name: Preserve candidate evidence without publishing production files
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: transmission-candidate-${{ matrix.repository }}
          path: application/artifacts/
          retention-days: 7
