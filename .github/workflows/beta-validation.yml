name: LDLC beta - build and Windows validation
on:
  workflow_dispatch:
    inputs:
      live_vendor_downloads:
        description: 'Retester les telechargements constructeurs reels (independants des corrections UI)'
        type: boolean
        default: true
      publish_delivery:
        description: 'Publier l EXE valide (false = capture de revue uniquement)'
        type: boolean
        default: true
      live_dashboard_roundtrip:
        description: 'Envoyer les echanges de test identifies au dashboard (laisser desactive pour les scenarios simules)'
        type: boolean
        default: false
permissions:
  contents: write
jobs:
  beta:
    if: github.repository == 'holyonefr/LDLC-Preparation-PC-test-app'
    runs-on: windows-2025
    timeout-minutes: 45
    env:
      LDLC_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          lfs: true
          persist-credentials: true
      - name: Compile the standalone beta executable on native Windows
        shell: powershell
        run: ./tools/Build-LDLCPreparationPCExe.ps1
      - name: Verify edition-independent manufacturer integration in both delivered scripts
        shell: powershell
        run: |
          ./tools/Test-LDLCVendorUtilityIntegration.ps1 -Source main -OutputDirectory artifacts/vendor-main
          ./tools/Test-LDLCVendorUtilityIntegration.ps1 -Source worker -OutputDirectory artifacts/vendor-worker
      - name: Check embedded integration, laptop exclusion and error reporting
        shell: powershell
        run: ./tools/Test-LDLCBetaVendorUtility.ps1
      - name: Check manufacturer step stays at the end of the applications phase
        shell: powershell
        run: ./tools/Test-LDLCBetaPlacement.ps1
      - name: Check synchronization preserves beta and never writes to stable
        shell: powershell
        run: ./tools/Test-LDLCBetaSync.ps1
      - name: Verify temporary outages and future releases for every manufacturer
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $powershell=Join-Path $env:WINDIR 'System32/WindowsPowerShell/v1.0/powershell.exe'
          foreach($test in @('Test-VendorResilience','Test-VendorDiscovery','Test-AsrockDiscovery','Test-GigabyteCoreDownload','Test-VendorUtility')){
            & $powershell -NoProfile -File "tools/experimental/vendor-utility/$test.ps1" -OutputDirectory "artifacts/resilience/$test"
            if($LASTEXITCODE -ne 0){throw "$test failed"}
          }
          & $powershell -NoProfile -File tools/experimental/motherboard/Test-MotherboardExperiment.ps1 -OutputDirectory artifacts/resilience/transport
          if($LASTEXITCODE -ne 0){throw 'Native HTTP transport regressions failed'}
          & $powershell -NoProfile -File tools/experimental/vendor-utility/Test-VendorFallback.ps1 -Native -OutputDirectory artifacts/resilience/fallback
          if($LASTEXITCODE -ne 0){throw 'Native official fallback regressions failed'}
      - name: Run the full release regression suite without installing software
        shell: powershell
        run: |
          ./tools/Test-LDLCRelease.ps1
          Import-Module ./tools/experimental/motherboard/MotherboardExperiment.psm1 -Force
          Write-MbxEvidence -Kind 'beta_release' -Data @{Status='passed';Suite='Test-LDLCRelease.ps1';VendorInstallerExecuted=$false}
      - name: Compare false warnings before and after correction on native Windows
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $revision='5136154b5e94f6a0f5793f8e3fc02f1b82e493e9'
          git fetch --depth=1 origin $revision
          if($LASTEXITCODE -ne 0){throw 'Historical warning source unavailable'}
          $zip=Join-Path $env:RUNNER_TEMP 'historical-default-warning.zip'
          $historical=Join-Path $env:RUNNER_TEMP ('historical-default-warning-'+[guid]::NewGuid().ToString('N'))
          git archive --format=zip --output=$zip $revision modules/70.DefaultApps.ps1 modules/05.Telemetry.ps1
          if($LASTEXITCODE -ne 0){throw 'Historical warning archive failed'}
          Expand-Archive -LiteralPath $zip -DestinationPath $historical
          ./tools/Test-DefaultAppsFinalWarnings.ps1 -ModuleRoot (Join-Path $historical 'modules') -Historical
          ./tools/Test-DefaultAppsFinalWarnings.ps1
      - name: Verify the final audit and native association reader with PowerShell 7
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          ./tools/Test-DefaultAppsFinalWarnings.ps1
          ./tools/Test-DefaultAppsNativeAssociation.ps1
          $path='HKCU:\Software\Microsoft\Windows\CurrentVersion\Explorer\FileExts\.pdf\UserChoice'
          $before=(Get-ItemProperty $path -ErrorAction SilentlyContinue).ProgId
          $diagnostic=./tools/Get-DefaultAppsDiagnostic.ps1 | ConvertFrom-Json
          $after=(Get-ItemProperty $path -ErrorAction SilentlyContinue).ProgId
          if(-not $diagnostic.ReadOnly -or $diagnostic.ConfigurationChanged -or $before -cne $after){throw 'Read-only PDF diagnostic changed the user association'}
          $evidence=@{Status='passed';ReadOnly=$true;ConfigurationChanged=$false;AdobeInstalledCount=@($diagnostic.AdobeInstalledPrograms).Count;AdobeDefaultConfirmed=$diagnostic.AdobeDefaultConfirmed;EffectivePdfProgId=$diagnostic.PdfEffective[0].ProgId;Mode='actual runner defaults, not the customer PC'}
          Write-Host ('::notice title=Read-only PDF diagnostic::'+($evidence|ConvertTo-Json -Compress))
      - name: Reproduce the historical failures and test the same cases after correction
        shell: powershell
        run: |
          git fetch --depth=1 origin ba8257821e7d5aaf53b5c0508116e6107dfc3e46
          if($LASTEXITCODE -ne 0){throw 'Historical revision unavailable'}
          ./tools/Test-PreparationRegressionComparison.ps1
      - name: Verify current AMD complete package and expected driver versions without running the installer
        shell: powershell
        run: ./tools/Test-LDLCAmdOfficialDownload.ps1 -FullPackage
      - name: Inspect the real Chocolatey AMD package and current-release fallback availability without installation
        shell: powershell
        run: ./tools/Test-LDLCAmdChocolateyPackage.ps1
      - name: Compare the AMD no-op bug before and after the correction
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $revision='f722c26dc047aaa4454e953b73f6905634667b61'
          # checkout is shallow: request the actual historical object explicitly.
          git fetch --depth=1 origin $revision
          if($LASTEXITCODE -ne 0){throw 'Historical AMD fetch failed'}
          $archive=Join-Path $env:RUNNER_TEMP 'historical-amd.zip'
          $historicalRoot=Join-Path $env:RUNNER_TEMP ('historical-amd-'+[guid]::NewGuid().ToString('N'))
          # Preserve original bytes/BOM instead of recoding native git stdout in PowerShell 5.1.
          git archive --format=zip --output=$archive $revision modules/60.Gpu.ps1
          if($LASTEXITCODE -ne 0){throw 'Historical AMD archive failed'}
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          [IO.Compression.ZipFile]::ExtractToDirectory($archive,$historicalRoot)
          $old=Join-Path $historicalRoot 'modules/60.Gpu.ps1'
          ./tools/Test-LDLCAmdUpdateRegression.ps1 -GpuModulePath $old -Historical -ReportPath artifacts/amd-before.json
          ./tools/Test-LDLCAmdUpdateRegression.ps1 -ReportPath artifacts/amd-after.json
      - name: Verify real acknowledgement and dashboard status for success error and cancellation
        if: inputs.live_dashboard_roundtrip
        shell: powershell
        run: ./tools/Test-PreparationDashboardRoundTrip.ps1 -ReportPath artifacts/dashboard-roundtrip.json
      - name: Verify live downloads and real Desktop shortcuts for all four vendors
        if: inputs.live_vendor_downloads
        shell: powershell
        run: ./tools/experimental/vendor-utility/Test-InstallerShortcut.ps1 -Live -Vendors ASRock,MSI,ASUS,GIGABYTE -OutputDirectory artifacts/beta-vendors-live
      - name: Open and close the actual beta UI four times
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $powershell=Join-Path $env:WINDIR 'System32/WindowsPowerShell/v1.0/powershell.exe'
          $passes=@()
          for($i=1;$i -le 4;$i++) {
            # Each double-click starts a fresh process. Reusing one process
            # incorrectly reinitializes Windows Forms after its first window.
            & $powershell -STA -NoProfile -ExecutionPolicy Bypass -File ./tools/Test-PreparationUiLaunch.ps1 -Artifacts "artifacts/preview-$i"
            if($LASTEXITCODE -ne 0){throw "UI launch $i failed"}
            $passes+=Get-Content "artifacts/preview-$i/geometry.json" -Raw | ConvertFrom-Json
          }
          Import-Module ./tools/experimental/motherboard/MotherboardExperiment.psm1 -Force
          Write-MbxEvidence -Kind 'beta_ui_launches' -Data @{Count=4;Failures=0;Passes=$passes;Mode='real_compiled_executable_preview_and_quit_isolated_processes';VendorInstallerExecuted=$false}
      - name: Publish only verified beta delivery files
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $origin=git remote get-url origin
          if(($origin -replace '.git$','') -cne 'https://github.com/holyonefr/LDLC-Preparation-PC-test-app'){throw 'Wrong publication repository'}
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          # Publish the generated Preview as review evidence. The test uses an
          # isolated runtime and never runs preparation or reads customer data.
          $previewEvidence='beta/evidence/quit-button-2026-10-19'
          New-Item -ItemType Directory -Path $previewEvidence -Force | Out-Null
          Copy-Item artifacts/preview-4/ui-preview.png "$previewEvidence/ui-preview.png" -Force
          Copy-Item artifacts/preview-4/geometry.json "$previewEvidence/geometry.json" -Force
          $publishDelivery='${{ inputs.publish_delivery }}' -eq 'true'
          if($publishDelivery){
            git add -- dist/LDLCPreparationPC.exe dist/LDLCPreparationPC.exe.config dist/LDLCPreparationPC.ps1 dist/LDLCPreparationPC.worker.embed.ps1 dist/SHA256SUMS.txt
            if($LASTEXITCODE -ne 0){throw 'Staging failed'}
          }
          git add -- "$previewEvidence/ui-preview.png" "$previewEvidence/geometry.json"
          if($LASTEXITCODE -ne 0){throw 'Preview evidence staging failed'}
          git diff --cached --quiet
          if($LASTEXITCODE -eq 1){
            $message=if($publishDelivery){'Publish Windows-compiled and validated LDLC beta executable'}else{'Save Windows preview for visual review before EXE publication'}
            git commit -m $message
            if($LASTEXITCODE -ne 0){throw 'Commit failed'}
            git push origin HEAD:main
            if($LASTEXITCODE -ne 0){throw 'Beta publication failed'}
          }
          Import-Module ./tools/experimental/motherboard/MotherboardExperiment.psm1 -Force
          $kind=if($publishDelivery){'beta_delivery'}else{'beta_preview_review'}
          Write-MbxEvidence -Kind $kind -Data @{Repository=$env:GITHUB_REPOSITORY;TestedSource=$env:GITHUB_SHA;DeliveryCommit=(git rev-parse HEAD);ExecutableSHA256=(Get-FileHash dist/LDLCPreparationPC.exe).Hash;PublishedExecutable=$publishDelivery;VendorInstallerExecuted=$false}
      - name: Preserve test evidence and Windows build
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: ldlc-beta-windows
          path: |
            artifacts/
            dist/*.exe
            dist/*.exe.config
            dist/*.zip
            dist/SHA256SUMS.txt
