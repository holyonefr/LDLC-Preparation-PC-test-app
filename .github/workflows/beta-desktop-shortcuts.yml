name: Beta - four vendor Desktop shortcuts and Windows photo
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  desktop:
    if: github.repository == 'holyonefr/LDLC-Preparation-PC-test-app'
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          lfs: false
          persist-credentials: false
      - name: Download each official utility twice and verify shortcuts on both Desktops
        timeout-minutes: 16
        shell: powershell
        run: ./tools/experimental/vendor-utility/Test-InstallerShortcut.ps1 -Live -Vendors ASRock,MSI,ASUS,GIGABYTE -CaptureDesktop -OutputDirectory artifacts/desktop-shortcuts
      - name: Preserve screenshot and precise test evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: beta-desktop-shortcuts
          path: |
            artifacts/desktop-shortcuts/*.png
            artifacts/desktop-shortcuts/*.json
