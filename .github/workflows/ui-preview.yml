name: Beta UI preview only
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  preview:
    if: github.repository == 'holyonefr/LDLC-Preparation-PC-test-app'
    runs-on: windows-2025
    timeout-minutes: 5
    env:
      LDLC_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          lfs: true
          persist-credentials: true
      - name: Build the real beta executable for UI review
        shell: powershell
        run: ./tools/Build-LDLCPreparationPCExe.ps1
      - name: Native UI rendering and four isolated launches
        id: ui
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          ./tools/Test-LDLCUIBranding.ps1
          ./tools/Test-ProgressTextRendering.ps1
          $powershell=Join-Path $env:WINDIR 'System32/WindowsPowerShell/v1.0/powershell.exe'
          for($i=1;$i -le 4;$i++){
            & $powershell -STA -NoProfile -File tools/Test-PreparationUiLaunch.ps1 -Artifacts "artifacts/review-$i"
            if($LASTEXITCODE -ne 0){throw "Native UI launch $i failed"}
          }
      - name: Save the isolated preview with its actual test status; never publish an EXE
        if: always()
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $image=Get-ChildItem artifacts/review-*/ui-preview.png -ErrorAction SilentlyContinue | Sort-Object FullName | Select-Object -Last 1
          if(-not $image){Write-Host 'No preview image produced';exit 0}
          $origin=git remote get-url origin
          if(($origin -replace '.git$','') -cne 'https://github.com/holyonefr/LDLC-Preparation-PC-test-app'){throw 'Wrong review repository'}
          $target='beta/evidence/quit-layout-review-2026-10-19'
          New-Item -ItemType Directory -Path $target -Force | Out-Null
          Copy-Item -LiteralPath $image.FullName -Destination "$target/ui-preview.png" -Force
          @{Source=$env:GITHUB_SHA;Run=$env:GITHUB_RUN_ID;UIStatus='${{ steps.ui.outcome }}';Mode='native isolated Preview, no preparation';ExecutablePublished=$false} | ConvertTo-Json | Set-Content "$target/review.json" -Encoding UTF8
          $geometry=Join-Path $image.DirectoryName 'geometry.json'
          if(Test-Path $geometry){Copy-Item $geometry "$target/geometry.json" -Force}else{Remove-Item "$target/geometry.json" -ErrorAction SilentlyContinue}
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- $target
          git diff --cached --quiet
          if($LASTEXITCODE -eq 1){
            git commit -m 'Save native UI review and its actual pass or failure status'
            if($LASTEXITCODE -ne 0){throw 'Review commit failed'}
            git push origin HEAD:main
            if($LASTEXITCODE -ne 0){throw 'Review push failed'}
          }
