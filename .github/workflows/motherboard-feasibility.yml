name: Motherboard feasibility (isolated, read only)
on:
  workflow_dispatch:
    inputs:
      phase:
        description: 'research or validation'
        type: choice
        options: [research, validation]
        default: validation
permissions:
  contents: read
jobs:
  experiment:
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          lfs: false
          persist-credentials: false
      - name: Install isolated PDF research dependency
        shell: powershell
        run: python -m pip install --disable-pip-version-check -r tools/experimental/motherboard/requirements-research.txt
      - name: Read current official vendor documentation
        shell: powershell
        run: ./tools/experimental/motherboard/Measure-OfficialSources.ps1 -OutputDirectory artifacts/motherboard/research
      - name: Validate isolated prototype
        if: inputs.phase == 'validation'
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $failures = @()
          foreach ($pass in 1..3) {
            try { ./tools/experimental/motherboard/Test-MotherboardExperiment.ps1 -Live -DownloadAudit:($pass -eq 1) -OutputDirectory "artifacts/motherboard/validation-$pass" }
            catch { $failures += "Passage $pass : $($_.Exception.Message)" }
          }
          if ($failures.Count) { throw ($failures -join '; ') }
      - name: Save evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: motherboard-feasibility
          path: |
            artifacts/motherboard/**/*.json
            artifacts/motherboard/**/*.txt
            artifacts/motherboard/**/*.html
          if-no-files-found: error
          retention-days: 14
